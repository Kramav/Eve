<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:7734">
  <title>Eve — API Keys</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../titlebar.css">
</head>
<body>

  <div class="titlebar">

      <span class="titlebar-title">INTEGRATIONS</span>
      <span class="titlebar-sub">Set up optional services &amp; skills</span>
    </div>

  <footer class="footer">
    <span class="status-msg" id="status-msg"></span>
  </footer>

  <script src="../eve-tauri-shim.js"></script>
